:root {
  --color-blue:        #0000ff;
  --color-chartreuse:  #becc24;
  --color-ruby:        #63001f;
  --color-wine:        #471224;
  --color-arctic:      #adcce9;
  --color-lilac:       #e8afc8;
  --color-white:       #ffffff;

  --bg:                var(--color-white);
  --fg:                var(--color-wine);

  --font-pixel:    "Pixelify Sans", "VT323", monospace;
  --font-display:  "Mozilla Headline", "Times New Roman", serif;
  --font-text:     "Mozilla Text", Georgia, "Times New Roman", serif;
  --font-ui:       "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;

  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur:      220ms;
}

/* The brand color SVG ships with empty <defs>, so paint via CSS */
.svg-color .cls-1 { fill: var(--color-chartreuse); }
.svg-color .cls-2 { fill: var(--color-ruby); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #fff;
  color: var(--color-wine);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }

::selection { background: var(--color-chartreuse); color: var(--color-wine); }

a {
  color: var(--color-blue);
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 2px;
}

.shell {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 64px;
}

/* ============== MINIBAR ============== */
.minibar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: #fff;
  border-bottom: 1.5px solid var(--color-wine);
  transform: translateY(-110%);
  transition: transform 280ms var(--ease-out);
}
.minibar.is-visible { transform: translateY(0); }
.minibar-mark {
  display: inline-flex; align-items: center;
  text-decoration: none;
  height: 32px;
}
.minibar-logo {
  display: block;
  height: 28px;
  width: auto;
}
.minibar-jump { display: flex; gap: 18px; list-style: none; padding: 0; margin: 0; }
.minibar-jump a {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  color: var(--color-wine);
  text-decoration: none;
}
.minibar-jump a:hover { color: var(--color-blue); }

/* ============== HERO v2 ============== */
.hero {
  min-height: calc(100vh - 72px);
  position: relative;
  background: var(--color-chartreuse);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Logo — sits behind portrait */
.hero-logo-wrap {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 1;
  padding: 36px 32px 0;
  pointer-events: none;
}
.hero-logo {
  display: block;
  width: 100%;
  max-width: 1100px;
  height: auto;
  margin: 0 auto;
  filter: brightness(0) invert(1);
  overflow: visible;
}

/* Portrait — floats over logo */
.hero-portrait-wrap {
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  height: 76%;
  transition: transform 0.4s cubic-bezier(.22,.68,0,1.2);
  cursor: default;
}
.hero-portrait-wrap:hover {
  transform: translateX(-52%) rotate(1.5deg) scale(1.03);
}
.hero-portrait-wrap img {
  height: 100%;
  width: auto;
  display: block;
}

/* Callout boxes */
.hero-callout {
  position: absolute;
  z-index: 2;
  border: 1.5px solid var(--color-blue);
  padding: 10px 14px;
  font-family: var(--font-pixel);
  font-size: 13px;
  color: var(--color-blue);
  line-height: 1.5;
  max-width: 200px;
  user-select: text;
  /* animation — starts hidden, slides out on hover */
  opacity: 0;
  pointer-events: none;
  transition: transform 0.42s cubic-bezier(.34,1.2,.64,1), opacity 0.28s ease;
}
.hero-callout.callout-visible {
  opacity: 1;
  pointer-events: auto;
}
.hero-callout p { margin: 0; }

/* Callout lines extending toward portrait — draw in after box appears */
.hero-callout-left::after {
  content: "";
  position: absolute;
  right: -22px; top: 50%;
  width: 0; height: 1.5px;
  background: var(--color-blue);
  transition: width 0.22s ease 0.28s;
}
.hero-callout-left.callout-visible::after { width: 18px; }

.hero-callout-right::before {
  content: "";
  position: absolute;
  left: -22px; top: 50%;
  width: 0; height: 1.5px;
  background: var(--color-blue);
  transition: width 0.22s ease 0.28s;
}
.hero-callout-right.callout-visible::before { width: 18px; }

/* Hover zones on portrait */
.hover-zone {
  position: absolute;
  left: 0; right: 0;
  z-index: 5;
  cursor: default;
}
.hover-zone-baby { top: 0; height: 40%; }
.hover-zone-mom  { top: 40%; bottom: 0; }

/* Socks */
.hero-socks {
  position: absolute;
  right: 12%; bottom: 12%;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.hero-socks-icons {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.sock-icon { width: 56px; height: auto; cursor: pointer; }
.sock-blue { animation: sockbuzz1 2.9s ease-in-out infinite; }
.sock-pink { width: 48px; animation: sockbuzz2 3.3s ease-in-out infinite; }
@keyframes sockbuzz1 {
  0%,100% { transform: rotate(-5deg) translate(0,0); }
  25%      { transform: rotate(-3deg) translate(3px,-4px); }
  50%      { transform: rotate(-6deg) translate(-2px,3px); }
  75%      { transform: rotate(-4deg) translate(4px,1px); }
}
@keyframes sockbuzz2 {
  /* scaleX(-1) baked in to flip pink sock */
  0%,100% { transform: scaleX(-1) rotate(8deg) translate(0,0); }
  25%      { transform: scaleX(-1) rotate(6deg) translate(-3px,3px); }
  50%      { transform: scaleX(-1) rotate(9deg) translate(2px,-3px); }
  75%      { transform: scaleX(-1) rotate(7deg) translate(-4px,-1px); }
}
.mom-of-two {
  font-family: var(--font-pixel);
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  cursor: pointer;
  letter-spacing: 0.03em;
  text-decoration: none;
  transition: color 0.15s, text-decoration 0.15s;
}
.mom-of-two:hover { color: var(--color-blue); text-decoration: underline; }

/* Terminal */
.hero-terminal {
  position: absolute;
  left: 14%; bottom: 12%;
  z-index: 2;
  width: 310px;
  background: #f2f1ec;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.12);
}
.terminal-titlebar {
  background: #dddbd4;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.terminal-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.terminal-dot.red    { background: #ff5f57; }
.terminal-dot.yellow { background: #febc2e; }
.terminal-dot.green  { background: #28c840; }
.terminal-filename {
  margin-left: auto;
  font-family: var(--font-pixel);
  font-size: 10px;
  color: #999;
  letter-spacing: 0.06em;
}
.terminal-body {
  padding: 12px 14px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  line-height: 1.75;
  color: #2a2a2a;
  user-select: text;
}
.terminal-body p { margin: 0; }
.terminal-prompt { color: #2c4f88; font-weight: 700; }
.terminal-indent { padding-left: 18px; color: #2c4f88; }
.terminal-cursor {
  display: inline-block;
  width: 7px; height: 13px;
  background: #2a2a2a;
  vertical-align: middle;
  margin-left: 2px;
  animation: blink 1.1s step-start infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* Status dot */
.hero-status {
  position: absolute;
  top: 18px; right: 24px;
  z-index: 5;
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-ui);
  font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase; font-weight: 600;
  color: rgba(255,255,255,0.85);
}
.hero-status .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--dot-color, var(--color-wine));
  box-shadow: 0 0 0 3px var(--dot-halo, rgba(71,18,36,.25));
  animation: pulse 1.6s ease-in-out infinite;
}
.hero-status[data-state="sleeping"]     { --dot-color: #ff3b30; --dot-halo: rgba(255,59,48,.28); }
.hero-status[data-state="napping"]      { --dot-color: #29c463; --dot-halo: rgba(41,196,99,.28); }
.hero-status[data-state="multitasking"] { --dot-color: #29c463; --dot-halo: rgba(41,196,99,.28); }

/* Bounce arrow */
.hero-arrow-wrap {
  position: absolute;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  cursor: pointer;
  padding: 8px;
}
.hero-arrow {
  display: block;
  width: 0; height: 0;
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-top: 16px solid rgba(255,255,255,1);
  animation: bob 1.6s ease-in-out infinite;
}
@keyframes bob {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(8px); }
}

/* Kids popup — floats above socks */
.kids-popup {
  position: absolute;
  bottom: calc(100% + 12px);
  right: 0;
  width: 220px;
  z-index: 10;
  animation: kidsPopUp 0.36s cubic-bezier(.34,1.3,.64,1) both;
  transform-origin: bottom right;
}
@keyframes kidsPopUp {
  from { opacity: 0; transform: translateY(16px) scale(0.88); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
.kids-popup img {
  display: block;
  width: 100%;
  border: 3px solid #fff;
  border-radius: 2px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.28);
}
.kids-popup-close {
  position: absolute;
  top: -10px; right: -10px;
  width: 24px; height: 24px;
  background: var(--color-wine);
  color: #fff; border: none; border-radius: 50%;
  font-size: 18px; cursor: pointer; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}

/* Mobile — Option B: portrait fills screen */
@media (max-width: 768px) {

  /* Hero takes full viewport height */
  .hero {
    min-height: 100svh;
    height: 100svh;
  }

  /* Portrait fills the whole hero */
  .hero-portrait-wrap {
    position: absolute !important;
    inset: 0 !important;
    bottom: auto !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    transform: none !important;
    z-index: 1 !important;
  }
  .hero-portrait-wrap:hover { transform: none !important; }
  .hero-portrait-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  /* Dark gradient at bottom for text readability */
  .hero-portrait-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 35%,
      rgba(0,0,0,0.38) 100%
    );
    z-index: 2;
  }

  /* Logo stays on top */
  .hero-logo-wrap { z-index: 3; padding: 24px 20px 0; }
  .hero-logo { max-width: 90vw; }

  /* Callout text — always visible, stacked at bottom, no boxes */
  .hero-callout {
    position: absolute !important;
    opacity: 1 !important;
    pointer-events: none;
    border: none !important;
    background: none !important;
    color: #fff !important;
    font-size: 14px !important;
    max-width: 80% !important;
    padding: 0 !important;
    z-index: 4;
    transform: none !important;
    transition: none !important;
  }
  .hero-callout::after, .hero-callout::before { display: none; }
  .hero-callout-left  { bottom: 198px; left: 24px; top: auto !important; right: auto !important; text-align: left; }
  .hero-callout-right { bottom: 168px; left: 24px; top: auto !important; right: auto !important; text-align: left; }

  /* Terminal — show as plain bio text, no window frame */
  .hero-terminal {
    position: absolute !important;
    bottom: 0 !important;
    left: 24px !important;
    right: 24px !important;
    top: auto !important;
    width: auto !important;
    background: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    z-index: 4;
    padding: 0 0 32px !important;
  }
  .terminal-titlebar { display: none; }
  .terminal-body {
    font-size: 13px !important;
    padding: 0 !important;
    background: none !important;
    color: #fff !important;
    line-height: 1.7 !important;
  }
  .terminal-body p { margin: 0 !important; }
  .terminal-indent { color: #fff !important; padding-left: 0 !important; }
  .terminal-body p:nth-child(1),
  .terminal-body p:nth-child(2) { display: none; }
  .terminal-now { display: none; }
  .terminal-prompt, .terminal-cursor { display: none; }

  /* Hide socks, hover zones, arrow */
  .hero-socks,
  .hero-arrow-wrap,
  .hover-zone { display: none; }
}


/* =====================================================
   WORK — editorial spreads + archive list
   ===================================================== */

.work {
  position: relative;
  padding: 120px 0 140px;
  background: #fff;
  overflow: hidden;
}
.work::before {
  /* a faint linen wash on the upper edge so the white isn't sterile */
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 200px;
  background:
    linear-gradient(180deg, rgba(232,175,200,.18), rgba(255,255,255,0));
  pointer-events: none;
}

/* ---------- Section masthead ---------- */
.work-masthead {
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px 32px;
  align-items: end;
  padding-top: 56px;
  padding-bottom: 28px;
  margin-bottom: 64px;
}
.work-masthead .section-eyebrow {
  position: absolute;
  top: 0;
  left: 0;
  margin-bottom: 0;
  align-self: start;
}
.work-masthead .section-eyebrow .rule { background: var(--color-ruby); }
.work-masthead .section-eyebrow .num  { background: var(--color-arctic); color: var(--color-wine); }
.index-header .section-eyebrow .rule { background: var(--color-ruby); }
.index-header .section-eyebrow .num  { background: var(--color-lilac); color: var(--color-wine); }
.work-masthead-eyebrow {
  font-family: var(--font-pixel);
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--color-wine);
  display: flex; align-items: baseline; gap: 8px;
}
.work-masthead-eyebrow .num {
  background: var(--color-wine);
  color: var(--color-chartreuse);
  padding: 2px 6px;
  font-size: 12px;
}
.work-masthead-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4.6vw, 72px);
  font-weight: 600;
  font-style: normal;
  font-stretch: 100%;
  letter-spacing: -0.025em;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
  color: var(--color-wine);
  max-width: 18ch;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}
.work-masthead-title .hl {
  background: var(--color-arctic);
  color: var(--color-wine);
  padding: 0.02em 0.14em 0.02em;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.work-masthead-title em {
  font-style: italic;
  font-stretch: 75%;
  font-weight: 400;
  font-weight: 400;
  color: var(--color-ruby);
}
.work-masthead-issue {
  text-align: right;
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-wine);
  font-weight: 600;
  line-height: 1.5;
}
.work-masthead-issue .price {
  font-family: var(--font-pixel);
  font-size: 22px;
  letter-spacing: 0;
  display: block;
  margin-top: 6px;
  color: var(--color-ruby);
}
.work-masthead-dek {
  margin: 28px 0 0;
  grid-column: 1;
  font-family: var(--font-text);
  font-size: 19px;
  line-height: 1.5;
  max-width: 56ch;
  color: color-mix(in oklab, var(--color-wine) 86%, white);
  text-wrap: pretty;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}
.work-masthead-dek em { font-style: italic; color: var(--color-ruby); }

/* ---------- Featured spreads ---------- */
.spreads {
  display: flex;
  flex-direction: column;
  gap: 96px;
  margin-bottom: 120px;
}
.spread {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
  align-items: stretch;
}
.spread.spread--right {
  grid-template-columns: 1fr 1.2fr;
}
.spread.spread--right .spread-media { order: 2; }
.spread.spread--right .spread-info  { order: 1; }

/* MEDIA */
.spread-media {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.spread-video {
  position: relative;
  aspect-ratio: 9/16;
  max-width: 360px;
  width: 100%;
  margin: 0 auto;
  border: 2.5px solid var(--color-arctic);
  box-shadow: 8px 8px 0 var(--color-arctic);
  background: var(--color-arctic);
  overflow: hidden;
  transition: transform var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
}
.spread-video:hover { transform: translate(-2px, -2px); box-shadow: 12px 12px 0 var(--color-arctic); }
.spread-video:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--color-blue); }
.spread-video .surface {
  position: absolute; inset: 0;
  background-position: center;
  background-size: cover;
}
.spread-video .surface.surface--denim {
  background-image:
    linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.95)),
    /* [bg photo] */;
}
.spread-video .surface.surface--leather {
  background-image:
    linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.95)),
    /* [bg photo] */;
}
.spread-video .surface.surface--suede {
  background-image:
    linear-gradient(135deg, rgba(71,18,36,.40), rgba(35,55,110,.85)),
    /* [bg photo] */;
}
.spread-video .surface.surface--linen {
  background-image:
    linear-gradient(135deg, rgba(232,175,200,.50), rgba(99,0,31,.65)),
    /* [bg photo] */;
}
.spread-video iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: 0;
}
.spread-video .play-button {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 96px; height: 96px;
  background: rgba(255,255,255,0.82);
  border: 2.5px solid var(--color-arctic);
  box-shadow: 4px 4px 0 var(--color-arctic);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.spread-video .play-button:hover {
  transform: translate(calc(-50% - 2px), calc(-50% - 2px));
  box-shadow: 6px 6px 0 var(--color-arctic);
}
.spread-video .play-button:active {
  transform: translate(calc(-50% + 4px), calc(-50% + 4px));
  box-shadow: 0 0 0 var(--color-blue);
}
.spread-video .play-button .triangle {
  width: 0; height: 0;
  border-style: solid;
  border-width: 18px 0 18px 28px;
  border-color: transparent transparent transparent var(--color-arctic);
  margin-left: 6px;
}

.spread-video .episode {
  position: absolute;
  top: 16px; left: 16px;
  font-family: var(--font-pixel);
  font-size: 13px;
  letter-spacing: 0.08em;
  color: #fff;
  background: var(--color-wine);
  padding: 4px 9px;
  border: 1.5px solid var(--color-wine);
}
.spread-video .runtime {
  position: absolute;
  bottom: 16px; right: 16px;
  font-family: var(--font-pixel);
  font-size: 14px;
  color: var(--color-chartreuse);
  background: var(--color-wine);
  padding: 4px 9px;
  border: 1.5px solid var(--color-chartreuse);
}
.spread-video .scanlines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    180deg,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(255,255,255,0.025) 2px,
    rgba(255,255,255,0.025) 3px
  );
  mix-blend-mode: overlay;
  pointer-events: none;
}
.play-btn:hover { color: #0000ff !important; text-shadow: none !important; }


/* caption strip below the video */
.spread-caption {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-pixel);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--color-wine);
  border-top: 1.5px dashed color-mix(in oklab, var(--color-wine) 40%, white);
  padding-top: 10px;
}
.spread-caption .left { display: inline-flex; gap: 12px; align-items: baseline; }
.spread-caption .swatch {
  display: inline-block;
  width: 9px; height: 9px;
  background: var(--color-chartreuse);
  border: 1px solid var(--color-wine);
}
.spread-caption .swatch[data-kind="tutorial"] { background: var(--color-chartreuse); }
.spread-caption .swatch[data-kind="demo"]     { background: #e8afc8; }
.spread-caption .swatch[data-kind="case"]     { background: #adcce9; }
.spread-caption .swatch[data-kind="app"]      { background: var(--color-ruby); }

/* INFO */
.spread-info {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 0;
  padding-top: 0;
}
.spread-info-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 0;
}
.spread-issue {
  display: flex;
  align-items: baseline;
  gap: 14px;
  border-bottom: 1.5px solid var(--color-wine);
  padding-bottom: 12px;
}
.spread-issue .issue-num {
  font-family: var(--font-display);
  font-style: italic;
  font-stretch: 75%;
  font-weight: 400;
  font-size: 32px;
  color: var(--color-ruby);
  letter-spacing: -0.02em;
  line-height: 1;
}
.spread-issue .issue-num .pix {
  font-family: var(--font-pixel);
  font-style: normal;
  font-size: 22px;
  color: var(--color-wine);
  background: var(--color-arctic);
  padding: 2px 6px;
  margin-right: 8px;
  vertical-align: 3px;
}
.spread-issue .issue-format {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--color-wine);
  margin-left: auto;
}
.spread-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4.6vw, 64px);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 0.95;
  margin: 0;
  text-wrap: balance;
  color: var(--color-wine);
  text-align: center;
}
.spread-title em {
  font-style: italic;
  font-stretch: 75%;
  font-weight: 400;
  color: var(--color-ruby);
}
.spread-title .hl {
  background: var(--color-chartreuse);
  color: var(--color-wine);
  padding: 0.02em 0.14em;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.spread-prose {
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.6;
  color: color-mix(in oklab, var(--color-wine) 92%, white);
  max-width: 46ch;
  text-wrap: pretty;
}
.spread-prose p { margin: 0 0 14px; }
.spread-prose p:last-child { margin: 0; }
.spread-prose .dropcap {
  font-family: var(--font-display);
  font-size: 56px;
  line-height: 0.85;
  font-weight: 700;
  color: var(--color-ruby);
  float: left;
  padding: 6px 12px 0 0;
  margin-top: 4px;
}

/* meta strip — newspaper credits row */
.spread-meta {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  border-top: 2.5px solid var(--color-ruby);
  padding-top: 16px;
}
.spread-meta .cell {
  display: flex; flex-direction: column; gap: 4px;
}
.spread-meta .key {
  font-family: var(--font-pixel);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--color-ruby);
  background: var(--color-chartreuse);
  width: fit-content;
  padding: 1px 5px;
  text-transform: uppercase;
}
.spread-meta .val {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  color: var(--color-wine);
  letter-spacing: 0.02em;
}
.spread-meta .val a {
  color: var(--color-blue);
  text-decoration: none;
}
.spread-meta .val a:hover { text-decoration: underline; }

/* index header — own block, top of archive */
.index-header {
  margin: 0 0 32px;
  padding-top: 24px;
  border-top: 2.5px solid var(--color-wine);
}
.index-header .section-eyebrow { margin-bottom: 0; }

.archive-rule {
  display: flex;
  align-items: center;
  gap: 24px;
  margin: 0 0 56px;
}
.archive-rule .pix {
  font-family: var(--font-pixel);
  font-size: 14px;
  letter-spacing: 0.14em;
  color: var(--color-wine);
  background: var(--color-chartreuse);
  padding: 6px 12px;
  border: 1.5px solid var(--color-wine);
  text-transform: uppercase;
}
.archive-rule .line {
  flex: 1;
  height: 0;
  border-top: 2.5px solid var(--color-wine);
}
.archive-rule .count {
  font-family: var(--font-pixel);
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--color-wine);
}

/* ---------- Archive list ---------- */
.col-pip-spacer { display: none; }

.archive-headrow {

<script type="text/babel">
// MiniBar — sticky logo + jump links, appears on scroll.
function MiniBar() {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 400);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <nav className={`minibar ${visible ? "is-visible" : ""}`} aria-label="page jumps">
      <a href="#home" className="minibar-mark" aria-label="AI@homemom — home">
        <img className="minibar-logo" src={window.__resources?.navLogoPng || "assets/logo.png"} alt="AI@homemom" />
      </a>
      <ul className="minibar-jump">
        <li><a href="#work">work</a></li>
        <li><a href="#index">index</a></li>
        <li><a href="#contact">contact</a></li>
      </ul>
    </nav>
  );
}
window.MiniBar = MiniBar;

<script type="text/babel">
// Hero — preserved from prior pass. Do not redesign.
function Hero() {
  const heroRef    = React.useRef(null);
  const portraitRef = React.useRef(null);
  const [pRect, setPRect] = React.useState(null);
  const [hovered, setHovered] = React.useState(false);
  const [modalOpen, setModalOpen] = React.useState(false);

  // Measure portrait position relative to hero, rerun on any resize
  React.useEffect(() => {
    function measure() {
      if (!heroRef.current || !portraitRef.current) return;
      const h = heroRef.current.getBoundingClientRect();
      const p = portraitRef.current.getBoundingClientRect();
      setPRect({
        left:   p.left  - h.left,
        right:  p.right - h.left,
        leftY:  (p.top  - h.top) + p.height * 0.20,  // near the baby
        rightY: (p.top  - h.top) + p.height * 0.50,  // mid-body
        heroW:  h.width,
      });
    }
    measure();
    // Re-measure after fonts + images finish loading
    window.addEventListener('load', measure);
    const ro = new ResizeObserver(measure);
    if (heroRef.current) ro.observe(heroRef.current);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); window.removeEventListener('load', measure); };
  }, []);

  const isMobile = typeof window !== 'undefined' && window.innerWidth < 769;
  const LINE_GAP = 22; // px from portrait edge to line end

  // Left callout: anchored so its right edge sits LINE_GAP left of portrait, positioned near baby
  const leftStyle = (!isMobile && pRect) ? {
    right: `${pRect.heroW - pRect.left + LINE_GAP}px`,
    top:   `${pRect.leftY}px`,
    transform: hovered ? 'translateX(0) translateY(-50%)' : 'translateX(36px) translateY(-50%)',
  } : {};

  // Right callout: anchored so its left edge sits LINE_GAP right of portrait, positioned mid-body
  const rightStyle = (!isMobile && pRect) ? {
    left:  `${pRect.right + LINE_GAP}px`,
    top:   `${pRect.rightY}px`,
    textAlign: 'left',
    transform: hovered ? 'translateX(0) translateY(-50%)' : 'translateX(-36px) translateY(-50%)',
  } : {};

  return (
    <section className="hero" id="home" data-screen-label="01 Hero" ref={heroRef}>

      {/* Logo — behind portrait */}
      <div className="hero-logo-wrap">
        <img className="hero-logo" src={window.__resources?.heroLogoSvg || "assets/logo.svg"} alt="AI@homemom" />
      </div>

      {/* Portrait — hover zones trigger callouts */}
      <div className="hero-portrait-wrap" ref={portraitRef}>
        <img src="assets/portrait.png" alt="chandler" onLoad={() => { if (!heroRef.current || !portraitRef.current) return; const h = heroRef.current.getBoundingClientRect(); const p = portraitRef.current.getBoundingClientRect(); setPRect({ left: p.left-h.left, right: p.right-h.left, leftY: (p.top-h.top)+p.height*0.20, rightY: (p.top-h.top)+p.height*0.50, heroW: h.width }); }} />
        <div className="hover-zone hover-zone-baby"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)} />
        <div className="hover-zone hover-zone-mom"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)} />
      </div>

      {/* Left callout */}
      <div className={`hero-callout hero-callout-left${hovered ? ' callout-visible' : ''}`} style={leftStyle}>
        <p>building apps during naps.</p>
      </div>

      {/* Right callout */}

      <div className="hero-terminal">
        <div className="terminal-titlebar">
          <span className="terminal-dot red"></span>
          <span className="terminal-dot yellow"></span>
          <span className="terminal-dot green"></span>
          <span className="terminal-filename">about.sh</span>
        </div>
        <div className="terminal-body">
          <p><span className="terminal-prompt">chandler@ai-at-home-mom:~$</span> cat about.txt</p>

          <p><span className="terminal-now">now </span>i use ai to build real things —</p>
          <p className="terminal-indent">activities for my family,</p>
          <p className="terminal-indent">things that make our days a little easier,</p>
          <p className="terminal-indent">&amp; whatever else i dream up.</p>

          <p><span className="terminal-prompt">chandler@ai-at-home-mom:~$</span><span className="terminal-cursor"></span></p>

      </div>

      <div className="hero-arrow-wrap" onClick={() => document.getElementById('work')?.scrollIntoView({ behavior: 'smooth' })}>
        <span className="hero-arrow"></span>
      </div>


    </section>
  );
}
window.Hero = Hero;

function Spread({ data, side }) {
  return (
    <article className={`spread spread--${side}`}>
      <div className="spread-media">
        <SpreadVideo
          surface={data.surface}
          episode={data.episode}
          runtime={data.runtime}
          alt={data.title}
          youtubeId={data.youtubeId}
          customThumb={data.customThumb} />
      </div>

      <div className="spread-info">
        <div className="spread-info-center">
          <h3 className="spread-title">
            {data.titleStart}
            {data.italic ? <em> {data.italic}</em> : null}
            {data.titleEnd ? <span> {data.titleEnd}</span> : null}
          </h3>

          {data.icons && (
            <div className="spread-icons">
              {data.icons.map((ic, i) => (
                <img key={i} src={ic.src} alt="" style={ic.style} />
              ))}
            </div>
          )}
        </div>

        <div className="spread-meta">
          {data.meta.map((m) => (
            <div className="cell" key={m.k}>
              <span className="key">{m.k}</span>
              <span className="val">
                {m.kind
                  ? <span style={{display:"inline-flex",alignItems:"center",gap:"7px"}}>
                      <span style={{display:"inline-block",width:"9px",height:"9px",background: m.kind==="case"?"#adcce9": m.kind==="demo"?"#e8afc8": m.kind==="app"?"var(--color-ruby)":"var(--color-chartreuse)",border:"1px solid var(--color-wine)",flexShrink:0}}></span>
                      {m.v}
                    </span>
                  : m.href
                    ? <a href={m.href} target="_blank">{m.v}</a>
                    : m.v}
              </span>
            </div>
          ))}
        </div>
      </div>
    </article>
  );
}

<script>
// Inline-color the brand SVG (its ships with empty <defs>) — class hooks on
// .svg-color make it paintable from CSS. We swap the <img> for inlined SVG.
(async () => {
  const imgs = document.querySelectorAll('img.hero-logo, img[data-inline-svg]');
  for (const img of imgs) {
    try {
      const r = await fetch(img.getAttribute('src'));
      const txt = await r.text();
      const div = document.createElement('div');
      div.innerHTML = txt;
      const svg = div.querySelector('svg');
      if (!svg) continue;
      svg.classList.add('svg-color');
      // copy attributes from the <img>
      for (const a of img.attributes) {
        if (a.name === 'src') continue;
        svg.setAttribute(a.name, a.value);
      }
      img.replaceWith(svg);
    } catch (e) { /* keep <img> as fallback */ }
  }
})();
</script>
